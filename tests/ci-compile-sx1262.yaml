# CI-only config for the SX1262 path, alongside the SX1276 one. Modelled on a
# Heltec WiFi LoRa 32 V4: an ESP32-S3 with an SX1262 behind an external PA.
#
# It exercises the three keys the SX1276 config cannot reach -- tcxo_voltage,
# dio2_as_rf_switch and setup_high -- because every one of them fails silently
# on hardware. A board with an unpowered front end still returns OK from
# begin() and still reports uplinks as sent; the only symptom is that nothing
# ever arrives at the gateway. A compile gate cannot catch that, but it can at
# least keep the config surface from regressing.
#
# Keys are placeholders from tests/secrets.yaml; this build never joins.
esphome:
  name: lorawan-ci-sx1262

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: arduino
  variant: ESP32S3

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [lorawan]

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery"
    id: battery
    update_interval: 60s
  - platform: lorawan
    lorawan_id: lw
    sensor: battery

lorawan:
  id: lw
  region: US915
  sub_band: 2
  dev_eui: !secret dev_eui
  join_eui: !secret join_eui
  app_key: !secret app_key
  uplink_interval: 5min
  radio:
    chip: sx1262
    cs_pin: GPIO8
    rst_pin: GPIO12
    dio1_pin: GPIO14
    busy_pin: GPIO13
    sck_pin: GPIO9
    miso_pin: GPIO11
    mosi_pin: GPIO10
    # The SX1262 powers its oscillator from DIO3; the wrong voltage means the
    # chip never clocks and begin() fails ERR_SPI_CMD_TIMEOUT.
    tcxo_voltage: 1.8
    # Antenna switch on DIO2 rather than a GPIO.
    dio2_as_rf_switch: true
    # Front-end power, enable, CTX and PA-mode select. Undriven, the radio is
    # deaf and the failure is invisible from the device side.
    setup_high: [GPIO7, GPIO2, GPIO5, GPIO46]
